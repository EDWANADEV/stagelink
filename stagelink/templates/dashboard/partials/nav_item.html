{% load i18n %}
{% comment %}
  Élément de navigation de l'espace de travail.
  Paramètres : label, url (absent = fonctionnalité pas encore disponible), key.
{% endcomment %}
{% if url %}
  <a href="{{ url }}"
     class="flex items-center rounded-[10px] px-3 py-2.5 text-sm font-medium transition {% if key == view.active_nav %}bg-primary/10 text-primary{% else %}text-ink hover:bg-background{% endif %}"
     {% if key == view.active_nav %}aria-current="page"{% endif %}>{{ label }}</a>
{% else %}
  <span class="flex cursor-not-allowed items-center justify-between rounded-[10px] px-3 py-2.5 text-sm font-medium text-muted/70"
        aria-disabled="true">
    {{ label }}
    <span class="rounded-full bg-background px-2 py-0.5 text-[11px] font-semibold text-muted">{% translate "Bientôt" %}</span>
  </span>
{% endif %}
