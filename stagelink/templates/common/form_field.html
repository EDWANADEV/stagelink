{% comment %}Champ de formulaire accessible. Paramètre : field.{% endcomment %}
<div>
  <label for="{{ field.id_for_label }}"
         class="mb-2 block text-sm font-semibold text-ink">
    {{ field.label }}
    {% if not field.field.required %}<span class="font-normal text-muted">({{ _("facultatif") }})</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}
    <p id="{{ field.auto_id }}_helptext" class="mt-2 text-xs text-muted">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    <p class="mt-2 text-sm font-medium text-red-600" role="alert">{{ field.errors|striptags }}</p>
  {% endif %}
</div>
