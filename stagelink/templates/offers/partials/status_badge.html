{% comment %}Badge de statut d'une offre. Paramètre : offer.{% endcomment %}
<span class="inline-flex w-fit items-center rounded-full px-3 py-1 text-xs font-semibold {% if offer.status == 'PUBLISHED' %}bg-primary/10 text-primary{% elif offer.status == 'CLOSED' %}bg-accent/15 text-ink{% else %}bg-background text-muted{% endif %}">
  {{ offer.get_status_display }}
</span>
