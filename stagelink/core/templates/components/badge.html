{% comment %}
    Composant Badge StageLink

    Variables :
    - label : texte du badge
    - variant : primary | accent | neutral
{% endcomment %}

<span
    class="
        inline-flex
        items-center
        rounded-badge
        px-2.5
        py-1
        text-xs
        font-semibold
        whitespace-nowrap

        {% if variant == 'primary' %}
            bg-primary/10
            text-primary-dark

        {% elif variant == 'accent' %}
            bg-accent/15
            text-text

        {% else %}
            bg-background
            text-text-muted
        {% endif %}
    "
>
    {{ label }}
</span>
